services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    # 主机端口 env 化，避免与宿主 4000（控制面 NestJS 占用）冲突。
    # 容器内仍监听 4000（healthcheck/DSH 容器名寻址不变），只改宿主暴露端口。
    ports:
      - "${LITELLM_PORT:-4001}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOG: "INFO"
      # 模型密钥一律从环境注入（配置文件中只有引用，见 D20）；缺省留空不报错
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    command:
      - "--config"
      - "/app/config.yaml"
    healthcheck:
      # 镜像无 curl；用 venv python3 探测（容器内 python3 已在 PATH）
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gateway

  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    # GPU 节点（D13：8×A100/H100；资源到位前本服务可暂不起，云端路由先通）。
    # 原 Docker 的 deploy.resources.reservations.devices 是 swarm 写法，podman-compose
    # 只渲染不生效；改为 podman 的 CDI 设备名（要求 Linux 宿主 + nvidia-container-toolkit）。
    # macOS podman machine 不支持 GPU 直通 —— 若有独立 Qwen 服务（D13）可不启动本服务，
    # 仅设 VLLM_BASE_URL/VLLM_MODEL/VLLM_API_KEY 即可，此时执行 `podman-compose up litellm`。
    devices:
      - nvidia.com/gpu=all
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${PRIVATE_MODEL:-Qwen/Qwen2.5-72B-Instruct}"
      - "--served-model-name"
      - "qwen-72b"
      - "--tensor-parallel-size"
      - "${TP_SIZE:-8}"
      - "--max-model-len"
      - "32768"
    networks:
      - gateway

volumes:
  model-cache:

networks:
  gateway:
    driver: bridge
