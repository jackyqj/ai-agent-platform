<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司 AI Agent 平台 · 试点商店</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e6e8eb; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; } .sub { color: #8a919c; font-size: 13px; margin-bottom: 20px; }
  .card { background: #171a21; border: 1px solid #262b36; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input, select, textarea { background: #0f1115; border: 1px solid #2c3340; color: #e6e8eb; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  input { min-width: 180px; } textarea { width: 100%; min-height: 48px; }
  button { background: #2f6fed; color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #3a4458; color: #c3c9d4; }
  button.danger { background: #b3423f; } button.ok { background: #2e8b57; }
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .agent { background: #171a21; border: 1px solid #262b36; border-radius: 10px; padding: 12px; }
  .agent h3 { margin: 0 0 6px; font-size: 15px; }
  .agent p { margin: 0 0 8px; color: #9aa3b0; font-size: 12px; min-height: 34px; }
  .meta { font-size: 11px; color: #6f7885; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; }
  .b-private { background: #3a2d12; color: #e0b64c; } .b-cloud { background: #14324d; color: #6db3f2; }
  .b-self { background: #2d1a3a; color: #c77df0; } .b-none { background: #1d2733; color: #8fa3ba; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #232833; }
  th { color: #8a919c; }
  .msg { font-size: 12px; color: #6db3f2; margin-top: 8px; white-space: pre-wrap; }
  section { margin-bottom: 22px; }
  section h2 { font-size: 15px; color: #c3c9d4; border-bottom: 1px solid #262b36; padding-bottom: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>公司 AI Agent 平台 · 试点商店</h1>
<div class="sub">本地演示版（dev 认证）— 控制面 API：<span id="apiHost">http://127.0.0.1:4000</span> · <a href="admin.html" style="color:#6db3f2">管理后台</a></div>

<section class="card row">
  <input id="userId" placeholder="用户 id（u-admin / u-dev-1 / u-hr-1）" value="u-admin">
  <button onclick="login()">登录（dev）</button>
  <span id="who"></span>
</section>

<section id="storeSection">
  <h2>Agent 商店</h2>
  <div class="agents" id="agents"></div>
</section>

<section id="proposeSection" class="card">
  <h2>提审新 Agent（员工自建）</h2>
  <div class="row">
    <input id="pId" placeholder="id（如 hr-flow）" style="min-width:110px">
    <input id="pName" placeholder="名称" style="min-width:110px">
    <input id="pDesc" placeholder="一句话描述" style="flex:1">
    <select id="pBased"><option>assistant</option><option>hr-assistant</option><option>report-builder</option><option>doc-search</option></select>
    <button onclick="propose()">提交提审</button>
  </div>
  <div class="msg" id="proposeMsg"></div>
</section>

<section id="adminSection" class="hidden">
  <h2>管理（admin）</h2>
  <div class="card">
    <h2 style="border:0;padding:0;margin:0 0 8px">待审批</h2>
    <div id="approvals"></div>
  </div>
  <div class="card">
    <h2 style="border:0;padding:0;margin:0 0 8px">全部 Agent（上架/下架）</h2>
    <div id="adminAgents"></div>
  </div>
  <div class="card">
    <h2 style="border:0;padding:0;margin:0 0 8px">用量看板（15）</h2>
    <div id="stats"></div>
  </div>
  <div class="card">
    <h2 style="border:0;padding:0;margin:0 0 8px">配额策略（16）</h2>
    <div id="quota"></div>
    <div class="row" style="margin-top:8px">
      <select id="qScope"><option value="all">全员</option><option value="user">用户</option></select>
      <input id="qScopeId" placeholder="user 时填用户 id / keyId" style="flex:1">
      <input id="qBudget" type="number" value="20" min="1" style="width:80px" title="每日任务数上限">
      <button onclick="setQuota()">设置/更新</button>
    </div>
  </div>
</section>

<div class="msg" id="msg"></div>

<script>
const API = document.getElementById('apiHost').textContent
let token = localStorage.getItem('cp_token') || ''
let role = ''

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  if (token) headers['Authorization'] = 'Bearer ' + token
  const res = await fetch(API + path, { ...opts, headers })
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.status)
  return res.json()
}

async function login() {
  try {
    const id = document.getElementById('userId').value
    const r = await api('/api/auth/dev/login?userId=' + id)
    token = r.accessToken
    localStorage.setItem('cp_token', token)
    const me = await api('/api/me')
    role = me.role
    document.getElementById('who').innerHTML = `已登录：${me.name}（${me.role} / ${me.dept}）` +
      (me.role === 'admin' ? ' · <a href="admin.html" style="color:#6db3f2">打开管理后台</a>' : '')
    document.getElementById('adminSection').classList.toggle('hidden', role !== 'admin')
    await Promise.all([loadStore(), loadAdmin()])
  } catch (e) { msg('登录失败：' + e.message) }
}

async function loadStore() {
  const r = await api('/api/agents')
  const el = document.getElementById('agents')
  el.innerHTML = r.agents.map(a => `
    <div class="agent">
      <h3>${a.name}</h3><p>${a.description}</p>
      <div class="meta">
        <span class="badge ${a.modelRoute.pinned ? 'b-private' : 'b-cloud'}">${a.modelRoute.model}</span>
        <span class="badge ${a.approvalLevel === 'none' ? 'b-none' : 'b-self'}">审批:${a.approvalLevel}</span>
      </div>
      <button onclick="useAgent('${a.id}')">选用</button>
      <div class="msg" id="use-${a.id}"></div>
    </div>`).join('')
}

async function useAgent(id) {
  try {
    const r = await api('/api/sessions', { method: 'POST', body: JSON.stringify({ agentPresetId: id }) })
    document.getElementById('use-' + id).textContent =
      `会话已创建：${r.sessionId}\n路由密钥（代理用）：${r.routingSecret}`
  } catch (e) { msg('选用失败：' + e.message) }
}

async function propose() {
  try {
    const body = {
      id: document.getElementById('pId').value,
      name: document.getElementById('pName').value,
      description: document.getElementById('pDesc').value,
      basedOn: document.getElementById('pBased').value,
    }
    const r = await api('/api/agents/propose', { method: 'POST', body: JSON.stringify(body) })
    document.getElementById('proposeMsg').textContent = r.notice + '（' + r.agent.id + '）'
    await loadAdmin()
  } catch (e) { document.getElementById('proposeMsg').textContent = '提审失败：' + e.message }
}

async function loadAdmin() {
  if (role !== 'admin') return
  const pend = await api('/api/admin/approvals/pending')
  document.getElementById('approvals').innerHTML = pend.approvals.length === 0
    ? '<div class="msg">无待审批</div>'
    : '<table><tr><th>请求人</th><th>操作</th><th>级别</th><th>动作</th></tr>' +
      pend.approvals.map(a => `<tr><td>${a.requesterUserId.slice(0,8)}</td><td>${a.action.slice(0,40)}</td>
        <td>${a.level}</td><td>
        <button class="ok" onclick="decide('${a.id}', true)">批准</button>
        <button class="danger" onclick="decide('${a.id}', false)">拒绝</button></td></tr>`).join('') + '</table>'
  const st = await api('/api/admin/stats/usage')
  const s = st.stats
  document.getElementById('stats').innerHTML =
    '<div class="row" style="margin-bottom:8px">' +
    '<span class="badge b-cloud">任务 ' + s.totals.tasks + '</span>' +
    '<span class="badge b-self">失败 ' + s.totals.failed + '</span>' +
    '<span class="badge b-none">待审批 ' + s.totals.pendingApprovals + '</span>' +
    '</div>' +
    '<table><tr><th>Agent</th><th>总数</th><th>失败</th><th>今日配额</th></tr>' +
    s.tasksByAgent.map(a => `<tr><td>${a.agent}</td><td>${a.total}</td><td>${a.failed}</td><td>${(s.quotaToday.find(q => true) ? '' : '')}</td></tr>`).join('') +
    '</table>' +
    (s.recentErrors.length ? '<div class="msg">最近失败：' + s.recentErrors.map(e => e.id + ' ' + (e.error || '').slice(0, 40)).join('；') + '</div>' : '')
  const q = await api('/api/admin/quota/policies')
  document.getElementById('quota').innerHTML = q.policies.length === 0 ? '<div class="msg">无策略</div>'
    : '<table><tr><th>范围</th><th>周期</th><th>每日任务上限</th><th>超限策略</th></tr>' +
      q.policies.map(p => `<tr><td>${p.scopeType}:${p.scopeId || 'all'}</td><td>${p.period}</td>
        <td>${p.budgetRequests}</td><td>${p.overPolicy}</td></tr>`).join('') + '</table>'
  const all = await api('/api/admin/agents')
  document.getElementById('adminAgents').innerHTML = all.agents.map(a =>
    `<div class="row" style="justify-content:space-between">
      <span>${a.name}（${a.id}）<span class="badge b-cloud">${a.status}</span></span>
      <button class="${a.status === 'published' ? 'danger' : 'ok'} ghost"
        onclick="toggle('${a.id}', '${a.status}')">${a.status === 'published' ? '下架' : '上架'}</button>
    </div>`).join('')
}

async function decide(id, approve) {
  await api('/api/admin/approvals/' + id + '/decide', { method: 'POST', body: JSON.stringify({ approve }) })
  await loadAdmin(); await loadStore()
}

async function toggle(id, status) {
  await api('/api/admin/agents/' + id + '/' + (status === 'published' ? 'unpublish' : 'publish'), { method: 'POST', body: '{}' })
  await loadAdmin(); await loadStore()
}

async function setQuota() {
  try {
    const body = {
      scopeType: document.getElementById('qScope').value,
      scopeId: document.getElementById('qScope').value === 'all' ? undefined : document.getElementById('qScopeId').value,
      period: 'day',
      budgetRequests: Number(document.getElementById('qBudget').value),
    }
    await api('/api/admin/quota/policies', { method: 'POST', body: JSON.stringify(body) })
    await loadAdmin()
  } catch (e) { msg('设置配额失败：' + e.message) }
}

function msg(t) { document.getElementById('msg').textContent = t }

if (token) login()
</script>
</body>
</html>
